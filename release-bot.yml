# Headless Mobile Release Bot configuration.
#
#   defaults   shared by every app (any key can be overridden per app)
#   accounts   one entry per Google Play developer account → its GitHub environment
#   apps       one entry per app on Play
#
# Multiple accounts/apps: see examples/multi-account.release-bot.yml and docs/multi-app.md.
# Changes here go through PR review like any other code.

defaults:
  # Used to decide "which weekday is it" for rollout steps. Cron schedules in the
  # workflows are UTC — keep them in sync with this.
  timezone: Europe/Berlin

  play:
    track: production
    initial_fraction: 0.02          # release day submit → 2% once Google approves
    release_notes_language: en-US
    default_release_notes: "Bug fixes and performance improvements."
    # Leave false unless Play asks for it (e.g. other changes pending review).
    changes_not_sent_for_review: false

  rollout:
    # The bot moves at most ONE step per run, so a held day just shifts the
    # schedule instead of jumping 2% → 50%. (Mock mode: every run is one step.)
    steps: [0.02, 0.20, 0.50, 1.0]
    targets:                        # weekday → highest fraction allowed that day
      monday: 0.20
      tuesday: 0.50
      wednesday: 1.0

  health:
    # Below this many daily users on the new version (Play Vitals), the data is
    # too noisy to judge. Advancing waits; halting still happens on hard signals.
    min_distinct_users: 1000

    crashlytics:
      enabled: true
      project: my-firebase-project
      dataset: firebase_crashlytics
      table: com_example_sandbox_ANDROID_REALTIME   # <package_with_underscores>_ANDROID_REALTIME
      lookback_days: 30
      # A fatal crash group that first appears in this build and hits at least
      # this many users → HALT.
      new_issue_min_users: 25

    play_vitals:
      enabled: true
      halt:                          # absolute — Google's bad-behaviour lines
        user_perceived_crash_rate: 0.0109
        user_perceived_anr_rate: 0.0047
      hold:                          # relative to the previous version
        crash_rate_increase_ratio: 1.25
        anr_rate_increase_ratio: 1.25

    grafana:
      enabled: false                 # set true and add GRAFANA_URL / GRAFANA_TOKEN
      matchers:
        - 'team="mobile"'
      halt_severities: [critical]
      hold_severities: [warning]

  # Channel IDs can also come from repo variables SLACK_CHANNEL_ID,
  # SLACK_ANNOUNCE_CHANNEL_ID, SLACK_ALERTS_CHANNEL_ID and SLACK_HERO_USERGROUP_ID.
  slack:
    channel_id: ""                   # release thread: one thread per version
    announce_channel_id: ""          # wider group: submitted, fully released, halted
    alerts_channel_id: ""            # your SLO alerts channel: halts and "needs a look"
    # @android-release-hero: pinged on halts, and decides who may submit/resume.
    # (User groups need a paid Slack plan.)
    hero_usergroup_id: ""

  access:
    # GitHub login → Slack user ID. Only people in this list AND currently in
    # @android-release-hero may submit or resume. Anyone can halt.
    release_heroes: {}
      # your-github-login: U0123456789

accounts:
  main:
    environment: play-production     # GitHub environment with this account's GCP_* variables

apps:
  example:
    account: main
    name: Example
    package_name: com.example.sandbox
    build:
      project_dir: examples/android-app   # where gradlew lives
      bundle_task: ":app:bundleRelease"
      aab_glob: app/build/outputs/bundle/release/*.aab
    # tag_prefix: ""                 # e.g. "shop/" for tags like shop/v4.12.0 in a monorepo
    # repository: org/other-repo     # app code in another repo (needs RELEASE_BOT_REPO_TOKEN)
    # signing_environment: android-signing   # GitHub environment with this app's upload key
