# Headless Mobile Release Bot configuration.
#
#   defaults   shared by every app (any key can be overridden per app)
#   accounts   one entry per Google Play developer account → its GitHub environment
#   apps       one entry per app on Play
#
# Multiple accounts/apps: see examples/multi-account.release-bot.yml and docs/multi-app.md.
# Changes here go through PR review like any other code.

defaults:
  # Used to decide "which weekday is it" for rollout steps. Cron schedules in the
  # workflows are UTC — keep them in sync with this.
  timezone: Europe/Berlin

  play:
    track: production
    release_notes_language: en-US
    default_release_notes: "Bug fixes and performance improvements."
    # Leave false unless Play asks for it (e.g. other changes pending review).
    changes_not_sent_for_review: false

  # ── Rollout schedule ── see docs/configuration.md
  rollout:
    # aligned: Android and iOS follow one schedule (it must be possible on iOS).
    # separate: give each platform its own, under android: {schedule: …} and ios: {schedule: …}
    platforms: aligned
    # Steps in order. `on` is a weekday, or "day N" (N days after the submit day).
    # The first step goes live when the store approves; later steps need green health.
    # This one matches Apple's phased release (1% → 2%) and then releases to everyone.
    schedule:
      - {on: monday,    percent: 1}
      - {on: tuesday,   percent: 2}
      - {on: wednesday, percent: 100}
    # Fewer users on the new version than health.min_users: hold, or advance anyway?
    when_data_is_thin: hold

  # ── Health: where signals come from, and what to do about them ──
  # Default: Google Play Console's Android vitals (Play Developer Reporting API).
  # It needs nothing beyond the Play service account. Everything else is optional:
  # uncomment a source AND its rules below. See docs/configuration.md.
  health:
    min_users: 1000                  # daily users on the new version before Play Vitals is trusted
    sources:
      play_vitals: {}                # Android only. Data is 1–2 days behind
      # crashlytics:                 # fast new-crash detection; Android + iOS. Needs the BigQuery export
      #   project: my-firebase-project
      #   dataset: firebase_crashlytics
      #   table: com_example_sandbox_ANDROID_REALTIME   # iOS: ios_table (default <bundle>_IOS_REALTIME)
      #   lookback_days: 30
      # grafana:                     # GRAFANA_URL variable + GRAFANA_TOKEN secret
      #   matchers: ['team="mobile"']
      # datadog:                     # DD_API_KEY + DD_APP_KEY secrets, DD_SITE variable
      #   query: 'tag:"team:mobile"' # Datadog monitor search syntax
    rules:                           # action: halt (stop) | hold (don't advance) | notify (tell, keep going)
      - {name: Google ANR line,   source: play_vitals, metric: user_perceived_anr_rate,   above: "0.47%", action: halt}
      - {name: Google crash line, source: play_vitals, metric: user_perceived_crash_rate, above: "1.09%", action: halt}
      - {name: ANR regression,    source: play_vitals, metric: user_perceived_anr_rate,   above_previous_by: "25%", action: hold}
      - {name: Crash regression,  source: play_vitals, metric: user_perceived_crash_rate, above_previous_by: "25%", action: hold}
      # - {name: New crash,       source: crashlytics, metric: new_fatal_issue_users, at_least: 25, action: halt}
      # - {name: Critical alert,  source: grafana, severity: critical, action: halt}
      # - {name: Warning alert,   source: grafana, severity: warning,  action: hold}
      # - {name: Monitor alerting, source: datadog, status: alert, priority: [1, 2], action: halt}
      # - {name: Monitor warning,  source: datadog, status: warn, action: notify}

  # Channel IDs can also come from repo variables SLACK_CHANNEL_ID,
  # SLACK_ANNOUNCE_CHANNEL_ID, SLACK_ALERTS_CHANNEL_ID and SLACK_HERO_USERGROUP_ID.
  slack:
    channel_id: ""                   # release thread: one thread per version
    announce_channel_id: ""          # wider group: submitted, fully released, halted
    alerts_channel_id: ""            # your SLO alerts channel: halts and "needs a look"
    # @android-release-hero: pinged on halts, and decides who may submit/resume.
    # (User groups need a paid Slack plan.)
    hero_usergroup_id: ""

  access:
    # Who's on duty: the Slack user group above, or an incident.io on-call schedule:
    # on_duty: {incident_io_schedule_id: 01H...}
    # GitHub login → Slack user ID (or incident.io email). Only people in this list AND
    # currently on duty may submit or resume. Anyone can halt.
    release_heroes: {}
      # your-github-login: U0123456789

accounts:
  main:
    environment: play-production     # GitHub environment with this account's GCP_* variables

apps:
  example:
    account: main
    name: Example
    package_name: com.example.sandbox
    platforms: [android]             # add ios once iOS support lands; validate checks the schedule fits
    build:
      project_dir: examples/android-app   # where gradlew lives
      bundle_task: ":app:bundleRelease"
      aab_glob: app/build/outputs/bundle/release/*.aab
    # tag_prefix: ""                 # e.g. "shop/" for tags like shop/v4.12.0 in a monorepo
    # repository: org/other-repo     # app code in another repo (needs RELEASE_BOT_REPO_TOKEN)
    # signing_environment: android-signing   # GitHub environment with this app's upload key
