# Three apps on one Google Play developer account, one app on another.
# Copy over release-bot.yml and adjust. Only the differences from the single-app
# file are shown under defaults; see release-bot.yml for every option.

defaults:
  timezone: Europe/Berlin
  play: {track: production, release_notes_language: en-US,
         default_release_notes: "Bug fixes and performance improvements.", changes_not_sent_for_review: false}
  rollout:
    platforms: aligned
    schedule:
      - {on: monday,    percent: 1}
      - {on: tuesday,   percent: 2}
      - {on: wednesday, percent: 100}
  health:
    min_users: 1000
    sources:
      play_vitals: {}
      crashlytics: {project: vaazh-firebase, dataset: firebase_crashlytics, table: OVERRIDE_PER_APP, lookback_days: 30}
      grafana: {matchers: ['team="mobile"']}
    rules:
      - {name: Google ANR line,   source: play_vitals, metric: user_perceived_anr_rate,   above: "0.47%", action: halt}
      - {name: Google crash line, source: play_vitals, metric: user_perceived_crash_rate, above: "1.09%", action: halt}
      - {name: ANR regression,    source: play_vitals, metric: user_perceived_anr_rate,   above_previous_by: "25%", action: hold}
      - {name: New crash,         source: crashlytics, metric: new_fatal_issue_users, at_least: 25, action: halt}
      - {name: Pager alert,       source: grafana, severity: critical, action: halt}
      - {name: Warning alert,     source: grafana, severity: warning,  action: notify}
  slack: {channel_id: C_ANDROID_RELEASES, announce_channel_id: C_MOBILE_ANNOUNCE,
          alerts_channel_id: C_SLO_ALERTS, hero_usergroup_id: S_ANDROID_HERO}
  access:
    release_heroes: {alice-gh: U0ALICE, bob-gh: U0BOB}

accounts:
  vaazh:                       # Play developer account #1
    environment: play-vaazh    # holds GCP_SERVICE_ACCOUNT for account #1
  partner:                     # Play developer account #2
    environment: play-partner  # holds GCP_SERVICE_ACCOUNT for account #2

apps:
  shop:
    account: vaazh
    name: Shop
    package_name: com.vaazh.shop
    repository: vaazh-studios/shop-android
    signing_environment: android-signing-shop
    health:
      sources: {crashlytics: {table: com_vaazh_shop_ANDROID_REALTIME}}

  chat:
    account: vaazh
    name: Chat
    package_name: com.vaazh.chat
    repository: vaazh-studios/chat-android
    signing_environment: android-signing-chat
    health:
      min_users: 300            # smaller user base
      sources: {crashlytics: {table: com_vaazh_chat_ANDROID_REALTIME}}

  fitness:
    account: vaazh
    name: Fitness
    package_name: com.vaazh.fitness
    repository: vaazh-studios/fitness-android
    signing_environment: android-signing-fitness
    rollout:                    # this team's own schedule: 5 days, Android only
      schedule:
        - {on: day 1, percent: 5}
        - {on: day 3, percent: 25}
        - {on: day 5, percent: 100}
    health:
      sources: {crashlytics: {table: com_vaazh_fitness_ANDROID_REALTIME}}
      rules:                    # stricter team: replaces the default rules
        - {name: Strict ANR, source: play_vitals, metric: user_perceived_anr_rate, above: "0.30%", action: halt}
        - {name: Any new crash, source: crashlytics, at_least: 5, action: halt}

  partner-app:
    account: partner
    name: Partner
    package_name: com.partner.app
    repository: partner-org/partner-android
    signing_environment: android-signing-partner
    slack: {channel_id: C_PARTNER_RELEASES}   # its own release channel
    health:
      sources: {crashlytics: {project: partner-firebase, table: com_partner_app_ANDROID_REALTIME}}
