name: Resolve app
description: Look up one app in release-bot.yml (environment, build settings, version from tag).
inputs:
  app:
    description: App id (leave empty for a single-app release-bot.yml)
    required: false
    default: ""
  platform:
    description: android or ios
    required: false
    default: android
  tag:
    description: Release tag to validate against the app's tag format
    required: false
    default: ""
outputs:
  app: {description: App id, value: "${{ steps.info.outputs.app }}"}
  platform: {description: android or ios, value: "${{ steps.info.outputs.platform }}"}
  state: {description: Mock-state key (app, or app-ios), value: "${{ steps.info.outputs.state }}"}
  name: {description: Display name, value: "${{ steps.info.outputs.name }}"}
  environment: {description: GitHub environment of the app's Play account, value: "${{ steps.info.outputs.environment }}"}
  signing_environment: {description: GitHub environment holding the upload key, value: "${{ steps.info.outputs.signing_environment }}"}
  repository: {description: Repo holding the app code (empty = this repo), value: "${{ steps.info.outputs.repository }}"}
  version: {description: Version from the tag, value: "${{ steps.info.outputs.version }}"}
  tag_pattern: {description: Glob of this app's release tags, value: "${{ steps.info.outputs.tag_pattern }}"}
  project_dir: {description: Gradle project directory, value: "${{ steps.info.outputs.project_dir }}"}
  bundle_task: {description: Gradle task producing the .aab, value: "${{ steps.info.outputs.bundle_task }}"}
  aab_glob: {description: Where the .aab lands, value: "${{ steps.info.outputs.aab_glob }}"}
  java_version: {description: JDK for the build, value: "${{ steps.info.outputs.java_version }}"}
runs:
  using: composite
  steps:
    - id: info
      shell: bash
      env:
        APP: ${{ inputs.app }}
        TAG: ${{ inputs.tag }}
        PLATFORM: ${{ inputs.platform }}
      run: python -m release_bot ${APP:+--app "$APP"} --platform "$PLATFORM" app-info --tag "$TAG" >> "$GITHUB_OUTPUT"
