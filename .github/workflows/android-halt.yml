# Big red button. Open to anyone with repo access: stopping a rollout is always safe.
name: "Android · HALT rollout"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android or ios"
        type: choice
        options: [android, ios]
        default: android
      app:
        description: "App id (leave empty if only one app is configured)"
        required: false
        type: string
      reason:
        description: "Why? (posted to Slack)"
        required: true
        type: string

# Own queue so a halt never waits behind a queued rollout step.
concurrency:
  group: android-release-halt-${{ inputs.app || 'app' }}${{ inputs.platform == 'ios' && '-ios' || '' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/rw-halt.yml
    with:
      platform: ${{ inputs.platform }}
      app: ${{ inputs.app }}
      reason: ${{ inputs.reason }}
      bot_repository: ${{ github.repository }}
      bot_ref: ${{ github.sha }}
    secrets: inherit
