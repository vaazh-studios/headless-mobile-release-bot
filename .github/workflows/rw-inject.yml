# Reusable workflow (Release bot · Sandbox incident). Call it from your repo:
#   jobs:
#     x:
#       uses: vaazh-studios/headless-mobile-release-bot/.github/workflows/rw-inject.yml@main
#       secrets: { SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }} }   # see examples/caller-workflows
name: "Release bot · Sandbox incident"

on:
  workflow_call:
    inputs:
      platform:
        description: "android or ios"
        type: string
        default: android
      app:
        description: "App id from release-bot.yml (empty if only one app is configured)"
        type: string
        default: ""
      config:
        description: "Path to release-bot.yml in the calling repo"
        type: string
        default: release-bot.yml
      bot_repository:
        description: "Where the bot's code lives"
        type: string
        default: vaazh-studios/headless-mobile-release-bot
      bot_ref:
        description: "Bot version to run (use the same ref as in `uses:`)"
        type: string
        default: main
      incident:
        description: "new-crash | anr-regression | anr-over-threshold | grafana-critical | grafana-warning | datadog-alert | datadog-warn | none"
        type: string
        required: true
    # Declared so callers in another org/account can pass them (secrets: inherit only
    # works within one organization). Environment secrets are read directly.
    secrets:
      SLACK_BOT_TOKEN:
        required: false
      GRAFANA_TOKEN:
        required: false
      DD_API_KEY:
        required: false
      DD_APP_KEY:
        required: false
      RELEASE_BOT_REPO_TOKEN:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_PRIVATE_KEY:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      PAGERDUTY_API_TOKEN:
        required: false
      PAGERDUTY_ROUTING_KEY:
        required: false
      OPTIMIZELY_TOKEN:
        required: false
      TEAMS_WEBHOOK_URL:
        required: false
      RELEASE_BOT_HTTP_ENV:
        required: false
      AMPLITUDE_API_KEY:
        required: false
      AMPLITUDE_SECRET_KEY:
        required: false
      INCIDENT_IO_API_KEY:
        required: false
      INCIDENT_IO_ALERT_TOKEN:
        required: false

env:
  PYTHONPATH: ${{ github.workspace }}/.release-bot
  RELEASE_BOT_CONFIG: ${{ inputs.config }}
  RELEASE_BOT_MODE: ${{ vars.RELEASE_BOT_MODE }}
  # Sandbox switches (unset in production).
  RELEASE_BOT_MOCK: ${{ vars.RELEASE_BOT_MOCK }}
  MOCK_LIVE_ACTIONS: ${{ vars.MOCK_LIVE_ACTIONS }}
  MOCK_ON_DUTY: ${{ vars.MOCK_ON_DUTY }}
  SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
  SLACK_ANNOUNCE_CHANNEL_ID: ${{ vars.SLACK_ANNOUNCE_CHANNEL_ID }}
  SLACK_ALERTS_CHANNEL_ID: ${{ vars.SLACK_ALERTS_CHANNEL_ID }}
  SLACK_HERO_USERGROUP_ID: ${{ vars.SLACK_HERO_USERGROUP_ID }}

jobs:
  resolve:
    name: Resolve app
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.app }}
      environment: ${{ steps.app.outputs.environment }}
      state: ${{ steps.app.outputs.state }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.bot_repository }}
          ref: ${{ inputs.bot_ref }}
          path: .release-bot
      - uses: ./.release-bot/.github/actions/release-bot-setup
      - id: app
        uses: ./.release-bot/.github/actions/resolve-app
        with:
          app: ${{ inputs.app }}
          platform: ${{ inputs.platform }}

  act:
    name: ${{ needs.resolve.outputs.app }}
    needs: resolve
    if: vars.RELEASE_BOT_MOCK == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      PAGERDUTY_API_TOKEN: ${{ secrets.PAGERDUTY_API_TOKEN }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      OPTIMIZELY_TOKEN: ${{ secrets.OPTIMIZELY_TOKEN }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      RELEASE_BOT_HTTP_ENV: ${{ secrets.RELEASE_BOT_HTTP_ENV }}
      AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
      AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
      INCIDENT_IO_API_KEY: ${{ secrets.INCIDENT_IO_API_KEY }}
      INCIDENT_IO_ALERT_TOKEN: ${{ secrets.INCIDENT_IO_ALERT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.bot_repository }}
          ref: ${{ inputs.bot_ref }}
          path: .release-bot
      - uses: ./.release-bot/.github/actions/release-bot-setup
      - if: env.RELEASE_BOT_MOCK == 'true'
        uses: ./.release-bot/.github/actions/mock-state
        with:
          mode: restore
          app: ${{ needs.resolve.outputs.state }}
      - name: Inject
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          APP: ${{ needs.resolve.outputs.app }}
          PLATFORM: ${{ inputs.platform }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          INCIDENT: ${{ inputs.incident }}
        run: python -m release_bot --app "$APP" --platform "$PLATFORM" mock-inject --incident "$INCIDENT"
      - name: Health check now
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          APP: ${{ needs.resolve.outputs.app }}
          PLATFORM: ${{ inputs.platform }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          INCIDENT: ${{ inputs.incident }}
        run: python -m release_bot --app "$APP" --platform "$PLATFORM" check --trigger "sandbox incident $INCIDENT"
      - if: always() && env.RELEASE_BOT_MOCK == 'true'
        uses: ./.release-bot/.github/actions/mock-state
        with:
          mode: save
          app: ${{ needs.resolve.outputs.state }}
