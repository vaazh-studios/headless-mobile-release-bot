# Checks every permission and connection each app needs, with fix-it hints. Read-only.
name: "Android · Doctor"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Only this app (empty = all apps)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/rw-doctor.yml
    with:
      app: ${{ inputs.app }}
      bot_repository: ${{ github.repository }}
      bot_ref: ${{ github.sha }}
    secrets: inherit
