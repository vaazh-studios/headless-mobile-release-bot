# Health gate for every app; halts automatically when a halt rule fires.
# Every 3 hours, and immediately on a Grafana webhook (repository_dispatch "rollout-alert").
name: "Android · Health check"

on:
  schedule:
    - cron: "17 */3 * * *"   # off the hour: GitHub delays top-of-hour crons the most
  repository_dispatch:
    types: [rollout-alert]
  workflow_dispatch:
    inputs:
      app:
        description: "Only this app (empty = all apps)"
        required: false
        type: string
      dry_run:
        description: "Check and report only — change nothing on Play"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/rw-health.yml
    with:
      app: ${{ inputs.app || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      bot_repository: ${{ github.repository }}
      bot_ref: ${{ github.sha }}
    secrets: inherit
