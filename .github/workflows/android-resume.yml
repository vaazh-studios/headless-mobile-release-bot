# Resume a halted rollout at the same percentage. Release hero only.
name: "Android · Resume rollout"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android or ios"
        type: choice
        options: [android, ios]
        default: android
      app:
        description: "App id (leave empty if only one app is configured)"
        required: false
        type: string
      reason:
        description: "Why is it safe to continue? (posted to Slack)"
        required: true
        type: string

concurrency:
  group: android-release-${{ inputs.app || 'app' }}${{ inputs.platform == 'ios' && '-ios' || '' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/rw-resume.yml
    with:
      platform: ${{ inputs.platform }}
      app: ${{ inputs.app }}
      reason: ${{ inputs.reason }}
      bot_repository: ${{ github.repository }}
      bot_ref: ${{ github.sha }}
    secrets: inherit
