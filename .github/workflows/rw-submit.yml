# Reusable workflow: release day submit. Call it from your repo:
#   jobs:
#     submit:
#       uses: vaazh-studios/headless-mobile-release-bot/.github/workflows/rw-submit.yml@main
#       with: {app: ${{ inputs.app }}, tag: ${{ inputs.tag }}}
#       secrets: { SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }} }   # see examples/caller-workflows
name: "Release bot · Submit to the store"

on:
  workflow_call:
    inputs:
      platform:
        description: "android (build .aab, upload to Play) or ios (submit the TestFlight build for review)"
        type: string
        default: android
      app:
        description: "App id from release-bot.yml (empty if only one app is configured)"
        type: string
        default: ""
      tag:
        description: "Release tag, e.g. v4.12.0 (or shop/v4.12.0 with a tag_prefix)"
        type: string
        required: true
      whats_new:
        description: "Play 'What's new' (en-US, max 500 chars). Empty = default text"
        type: string
        default: ""
      supersede_unfinished_rollout:
        description: "Replace a release that isn't at 100% yet"
        type: boolean
        default: false
      config:
        description: "Path to release-bot.yml in the calling repo"
        type: string
        default: release-bot.yml
      bot_repository:
        description: "Where the bot's code lives"
        type: string
        default: vaazh-studios/headless-mobile-release-bot
      bot_ref:
        description: "Bot version to run (use the same ref as in `uses:`)"
        type: string
        default: main

    # Declared so callers in another org/account can pass them (secrets: inherit only
    # works within one organization). Environment secrets are read directly.
    secrets:
      SLACK_BOT_TOKEN:
        required: false
      GRAFANA_TOKEN:
        required: false
      RELEASE_BOT_REPO_TOKEN:
        required: false
      ANDROID_UPLOAD_KEYSTORE_BASE64:
        required: false
      ANDROID_UPLOAD_STORE_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_PRIVATE_KEY:
        required: false
      TEAMS_WEBHOOK_URL:
        required: false

env:
  PYTHONPATH: ${{ github.workspace }}/.release-bot
  RELEASE_BOT_CONFIG: ${{ inputs.config }}
  RELEASE_BOT_MODE: ${{ vars.RELEASE_BOT_MODE }}
  # Sandbox switches (unset in production).
  RELEASE_BOT_MOCK: ${{ vars.RELEASE_BOT_MOCK }}
  MOCK_ON_DUTY: ${{ vars.MOCK_ON_DUTY }}
  SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
  SLACK_ANNOUNCE_CHANNEL_ID: ${{ vars.SLACK_ANNOUNCE_CHANNEL_ID }}
  SLACK_ALERTS_CHANNEL_ID: ${{ vars.SLACK_ALERTS_CHANNEL_ID }}
  SLACK_HERO_USERGROUP_ID: ${{ vars.SLACK_HERO_USERGROUP_ID }}

jobs:
  resolve:
    name: Resolve app + tag
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.app }}
      state: ${{ steps.app.outputs.state }}
      environment: ${{ steps.app.outputs.environment }}
      signing_environment: ${{ steps.app.outputs.signing_environment }}
      repository: ${{ steps.app.outputs.repository }}
      version: ${{ steps.app.outputs.version }}
      tag_pattern: ${{ steps.app.outputs.tag_pattern }}
      project_dir: ${{ steps.app.outputs.project_dir }}
      bundle_task: ${{ steps.app.outputs.bundle_task }}
      aab_glob: ${{ steps.app.outputs.aab_glob }}
      java_version: ${{ steps.app.outputs.java_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.bot_repository }}
          ref: ${{ inputs.bot_ref }}
          path: .release-bot
      - uses: ./.release-bot/.github/actions/release-bot-setup
      - name: release-bot.yml is valid
        env:
          APP: ${{ inputs.app }}
        run: python -m release_bot ${APP:+--app "$APP"} validate
      - id: app
        uses: ./.release-bot/.github/actions/resolve-app
        with:
          app: ${{ inputs.app }}
          platform: ${{ inputs.platform }}
          tag: ${{ inputs.tag }}

  preflight:
    name: Release hero + previous rollout check
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.bot_repository }}
          ref: ${{ inputs.bot_ref }}
          path: .release-bot
      - uses: ./.release-bot/.github/actions/release-bot-setup
        with:
          workload_identity_provider: ${{ inputs.platform == 'android' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER || '' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - if: env.RELEASE_BOT_MOCK == 'true'
        uses: ./.release-bot/.github/actions/mock-state
        with:
          mode: restore
          app: ${{ needs.resolve.outputs.state }}
      - name: Only the on-duty @android-release-hero may submit
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          APP: ${{ needs.resolve.outputs.app }}
          PLATFORM: ${{ inputs.platform }}
        run: python -m release_bot --app "$APP" --platform "$PLATFORM" authorize --actor "$GITHUB_ACTOR"
      - name: Previous rollout finished?
        env:
          APP: ${{ needs.resolve.outputs.app }}
          PLATFORM: ${{ inputs.platform }}
          FORCE: ${{ inputs.supersede_unfinished_rollout && '--force' || '' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python -m release_bot --app "$APP" --platform "$PLATFORM" precheck-submit $FORCE

  build:
    name: Build signed .aab from tag
    if: inputs.platform == 'android'
    needs: [resolve, preflight]
    runs-on: ubuntu-latest
    # Only the upload key lives here: this job never sees Play credentials.
    environment: ${{ needs.resolve.outputs.signing_environment }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ needs.resolve.outputs.project_dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve.outputs.repository || github.repository }}
          ref: refs/tags/${{ inputs.tag }}
          # Apps in another repo need RELEASE_BOT_REPO_TOKEN (see docs/multi-app.md).
          token: ${{ secrets.RELEASE_BOT_REPO_TOKEN || github.token }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ needs.resolve.outputs.java_version }}
          cache: gradle
      - name: Build release bundle
        env:
          BUNDLE_TASK: ${{ needs.resolve.outputs.bundle_task }}
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        # android.injected.signing.* signs with the upload key without touching build.gradle.
        run: |
          signing=()
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            signing=(
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks"
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD"
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            )
          elif [ "$RELEASE_BOT_MOCK" = "true" ]; then
            echo "::warning::No upload keystore configured; building an unsigned bundle (sandbox only)."
          else
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set in the signing environment."
            exit 1
          fi
          ./gradlew "$BUNDLE_TASK" --no-daemon "${signing[@]}"
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Locate bundle
        env:
          AAB_GLOB: ${{ needs.resolve.outputs.aab_glob }}
        run: |
          shopt -s nullglob
          files=($AAB_GLOB)
          [ ${#files[@]} -eq 1 ] || { echo "::error::expected exactly one .aab for '$AAB_GLOB', found ${#files[@]}"; exit 1; }
          cp "${files[0]}" "$RUNNER_TEMP/app-release.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: aab
          path: ${{ runner.temp }}/app-release.aab
          retention-days: 30

  release-notes:
    name: GitHub release notes
    needs: [resolve, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.notes.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve.outputs.repository || github.repository }}
          token: ${{ secrets.RELEASE_BOT_REPO_TOKEN || github.token }}
          fetch-depth: 0
      - id: notes
        name: Generate notes since the previous tag of this app
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_REPO_TOKEN || github.token }}
          REPO: ${{ needs.resolve.outputs.repository || github.repository }}
          TAG: ${{ inputs.tag }}
          PATTERN: ${{ needs.resolve.outputs.tag_pattern }}
        run: |
          prev=$(git tag --list "$PATTERN" --sort=-v:refname | grep -x -A1 -F "$TAG" | sed -n 2p || true)
          args=(-f tag_name="$TAG")
          [ -n "$prev" ] && args+=(-f previous_tag_name="$prev")
          body=$(gh api "repos/$REPO/releases/generate-notes" "${args[@]}" --jq .body)
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$REPO" --notes "$body"
          else
            gh release create "$TAG" -R "$REPO" --verify-tag --title "$TAG" --notes "$body"
          fi
          echo "url=$(gh release view "$TAG" -R "$REPO" --json url --jq .url)" >> "$GITHUB_OUTPUT"

  publish:
    name: Upload to Play at initial rollout
    if: inputs.platform == 'android'
    needs: [resolve, build, release-notes]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.bot_repository }}
          ref: ${{ inputs.bot_ref }}
          path: .release-bot
      - uses: ./.release-bot/.github/actions/release-bot-setup
        with:
          workload_identity_provider: ${{ inputs.platform == 'android' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER || '' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - if: env.RELEASE_BOT_MOCK == 'true'
        uses: ./.release-bot/.github/actions/mock-state
        with:
          mode: restore
          app: ${{ needs.resolve.outputs.state }}
      - uses: actions/download-artifact@v8
        with:
          name: aab
          path: ${{ runner.temp }}
      - name: Attach .aab to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_REPO_TOKEN || github.token }}
          REPO: ${{ needs.resolve.outputs.repository || github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/app-release.aab" -R "$REPO" --clobber
      - name: Submit to Play
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          APP: ${{ needs.resolve.outputs.app }}
          VERSION: ${{ needs.resolve.outputs.version }}
          WHATS_NEW: ${{ inputs.whats_new }}
          RELEASE_URL: ${{ needs.release-notes.outputs.url }}
        run: |
          python -m release_bot --app "$APP" submit \
            --aab "$RUNNER_TEMP/app-release.aab" \
            --version "$VERSION" \
            --notes "$WHATS_NEW" \
            --release-url "$RELEASE_URL"
      - if: always() && env.RELEASE_BOT_MOCK == 'true'
        uses: ./.release-bot/.github/actions/mock-state
        with:
          mode: save
          app: ${{ needs.resolve.outputs.state }}

  publish-ios:
    name: Submit TestFlight build for App Store review
    if: inputs.platform == 'ios'
    needs: [resolve, release-notes]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.bot_repository }}
          ref: ${{ inputs.bot_ref }}
          path: .release-bot
      - uses: ./.release-bot/.github/actions/release-bot-setup
      - if: env.RELEASE_BOT_MOCK == 'true'
        uses: ./.release-bot/.github/actions/mock-state
        with:
          mode: restore
          app: ${{ needs.resolve.outputs.state }}
      - name: Submit for review (phased release, manual release)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APP: ${{ needs.resolve.outputs.app }}
          VERSION: ${{ needs.resolve.outputs.version }}
          WHATS_NEW: ${{ inputs.whats_new }}
          RELEASE_URL: ${{ needs.release-notes.outputs.url }}
        run: |
          python -m release_bot --app "$APP" --platform ios submit \
            --aab - --version "$VERSION" --notes "$WHATS_NEW" --release-url "$RELEASE_URL"
      - if: always() && env.RELEASE_BOT_MOCK == 'true'
        uses: ./.release-bot/.github/actions/mock-state
        with:
          mode: save
          app: ${{ needs.resolve.outputs.state }}
